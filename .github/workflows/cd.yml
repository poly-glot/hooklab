name: CD

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  DENO_VERSION: '2.x'
  NODE_VERSION: '22'
  GCP_REGION: ${{ vars.GCP_REGION || 'europe-west2' }}
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'firebase-cloud-491613' }}
  CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'hooklab-api' }}
  AR_REPO: ${{ vars.AR_REPO || 'firebase-cloud' }}
  FIREBASE_SITE_ID: ${{ vars.FIREBASE_SITE_ID || 'hooklab' }}

jobs:
  # ──────────────────────────────────────────────
  # CI Gate — run full CI first
  # ──────────────────────────────────────────────
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # ──────────────────────────────────────────────
  # Build & push server container image
  # ──────────────────────────────────────────────
  build-push-image:
    name: Build & Push Server Image
    runs-on: ubuntu-latest
    needs: [ci]
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/api:${SHORT_SHA}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Image: ${IMAGE}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────
  # Deploy to Staging
  # ──────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [ci, build-push-image]
    environment:
      name: staging
      url: ${{ steps.urls.outputs.hosting_url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # ── Deploy Cloud Run (server) ──
      - name: Deploy server to Cloud Run (staging tag)
        run: |
          gcloud run deploy ${{ env.CLOUD_RUN_SERVICE }} \
            --image ${{ needs.build-push-image.outputs.image }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --tag staging \
            --no-traffic \
            --quiet

      - name: Smoke-test staging Cloud Run
        run: |
          STAGING_URL=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} \
            --region ${{ env.GCP_REGION }} \
            --format 'value(status.traffic[0].url)' 2>/dev/null || true)
          # Fallback: use the tag URL pattern
          if [ -z "$STAGING_URL" ]; then
            STAGING_URL="https://staging---${{ env.CLOUD_RUN_SERVICE }}-$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} --region ${{ env.GCP_REGION }} --format='value(status.url)' | sed 's|https://||')"
          fi
          echo "Staging URL: $STAGING_URL"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${STAGING_URL}/api/health" || echo "000")
          echo "Health check: HTTP $STATUS"

      # ── Deploy Firebase Hosting (client) to preview channel ──
      - name: Download client artifact
        uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client/dist/

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy client to staging hosting channel
        id: urls
        run: |
          if [ -n "${{ env.FIREBASE_SITE_ID }}" ]; then
            OUTPUT=$(firebase hosting:channel:deploy staging \
              --project ${{ env.GCP_PROJECT_ID }} \
              --site ${{ env.FIREBASE_SITE_ID }} \
              --expires 7d \
              --json 2>/dev/null || true)
            URL=$(echo "$OUTPUT" | jq -r '.result // empty | to_entries[0].value.url // empty' 2>/dev/null)
          fi
          if [ -z "$URL" ]; then
            URL="https://${{ env.FIREBASE_SITE_ID }}--staging.web.app"
          fi
          echo "hosting_url=$URL" >> "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────────
  # Deploy to Production
  # ──────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging, build-push-image]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: production
      url: ${{ steps.urls.outputs.site_url }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # ── Promote Cloud Run to live traffic ──
      - name: Deploy server to Cloud Run (production)
        run: |
          gcloud run deploy ${{ env.CLOUD_RUN_SERVICE }} \
            --image ${{ needs.build-push-image.outputs.image }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --quiet

      # ── Deploy Firebase Hosting (client) to live ──
      - name: Download client artifact
        uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client/dist/

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore rules & indexes
        run: |
          firebase deploy --only firestore --force --project ${{ env.GCP_PROJECT_ID }}

      - name: Deploy client to Firebase Hosting (live)
        id: urls
        run: |
          firebase deploy --only hosting --force --project ${{ env.GCP_PROJECT_ID }}
          SITE_URL="https://${{ env.FIREBASE_SITE_ID }}.web.app"
          if [ -n "${{ vars.CUSTOM_DOMAIN }}" ]; then
            SITE_URL="https://${{ vars.CUSTOM_DOMAIN }}"
          fi
          echo "site_url=$SITE_URL" >> "$GITHUB_OUTPUT"

      # ── Tag the release ──
      - name: Create release tag
        uses: actions/github-script@v7
        with:
          script: |
            const pkg = require('./client/package.json');
            const tag = `v${pkg.version}-${context.sha.substring(0, 7)}`;
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tag}`,
                sha: context.sha
              });
              core.info(`Created tag ${tag}`);
            } catch (e) {
              core.warning(`Tag ${tag} may already exist: ${e.message}`);
            }

  # ──────────────────────────────────────────────
  # Post-deploy smoke test
  # ──────────────────────────────────────────────
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [deploy-production]
    steps:
      - name: Health-check site and API
        run: |
          SITE_URL="https://hooklab.junaid.guru"
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "${SITE_URL}")
          echo "Hosting: HTTP $STATUS"
          [ "$STATUS" -eq 200 ] || { echo "Hosting smoke test FAILED"; exit 1; }

          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "${SITE_URL}/api/health")
          echo "API: HTTP $STATUS"
          [ "$STATUS" -eq 200 ] || { echo "API smoke test FAILED"; exit 1; }

          echo "All smoke tests passed"
